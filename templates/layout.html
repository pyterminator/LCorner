{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% block title %}{% endblock %}
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- Font Space-Grotesk-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">

    <!-- Dashboard style -->
    <link rel="stylesheet" href="{% static 'css/dashboard-style.min.css' %}">
    <!-- Colors -->
    <link rel="stylesheet" href="{% static 'css/colors.min.css' %}">
    <!-- Quiz Models Style -->
    <link rel="stylesheet" href="{% static 'css/quiz-models.min.css' %}">

    {% block styles %}{% endblock %}

    <!-- Fontu sabitlə -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: inherit;
            user-select: none;
        }

        html {
            font-family: "Space Grotesk", sans-serif;
            font-size: 10px;
        }

        body {
            background-color: var(--main);
        }

        a {
            text-decoration: none;
            color: inherit;
            cursor: pointer;
        }

        button {
            cursor: pointer;
        }

        input, button{
            outline: none;
            border: none;
            background-color: transparent;
        }
    </style>
</head>

<body>
    <div id="root">
        <div>
            <h1 id="logo">
                ECorner
            </h1>
            <div class="menu">
                <a href="{% url 'dashboard' %}"><i class="fa-solid fa-home"></i> Ana səhifə</a>
                <a href="{% url 'levels' %}"><i class="fa-solid fa-chart-bar"></i> Səviyyələr</a>
                <a href="{% url 'quizmodels' %}"><i class="fa-regular fa-square-plus"></i> Sual yarat</a>
            </div>
        </div>
        <div>
            <nav>
                <div class="links">
                    <a href="{% url 'dashboard' %}">Ana səhifə</a>
                    <a href="#">Əlaqə</a>
                </div>
                <div class="profile">
                    <a href="{% url 'login' %}">
                        <i class="fa-solid fa-arrow-right-to-bracket"></i> Daxil ol
                    </a>
                    <!-- <span onclick="openDropdownMenu(this)"><i class="fa-regular fa-user"></i> Hesabım</span>
                    <div class="dropdown-menu">
                        <a href="#"><i class="fa-solid fa-gear"></i> Tənzimləmələr</a>
                        <a href="#"><i class="fa-regular fa-bell"></i> Bildirişlər</a>
                    </div> -->
                </div>
            </nav>

            <main>
                <!-- Block Root -->
                {% block root %} {% endblock %}
            </main>
                
            <footer>
                © Müəllif hüquqları qorunur - {% now "Y" %} | Yazar : <a href="https://youtube.com/@pyterminator" target="_blank"><i class="fa-brands fa-youtube"></i> PyTerminator</a>
            </footer>
        </div>
    </div>

    <script src="{% static 'scripts/custom.js' %}"></script>
</body>

</html>
