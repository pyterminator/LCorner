{% extends 'layout.html' %}
{% load static %}

<!-- Page Title -->
{% block title %}
    <title>
        ECorner - {{ exam.title }}
    </title>
{% endblock %}


<!-- Style -->
{% block styles %}
    <link rel="stylesheet" href="{% static 'css/exam-pano.min.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
{% endblock %}


{% block root %}

    <!-- Breadcrumb olmaz -->

    <div class="exam-pano" data-url="{% url 'generatequizforexampano' exam.slug %}" data-uri="{% url 'exampanocheckanswer' %}">
        <div class="header">
            <div class="left">Sual</div>
            <div class="right">
                <button>
                    <i class="fa-regular fa-bookmark"></i>
                </button>
            </div>
        </div>
        
        <!-- ExamBox -->
        <div class="button-group">
            <button id="get-prev-quiz">
                <i class="fa-solid fa-arrow-left"></i> Əvvəlki
            </button>
            <span>
                5
            </span>
            <button onclick="nextQuiz(this)" id="get-next-quiz">
                Sonrakı <i class="fa-solid fa-arrow-right"></i>
            </button>
        </div>
    </div>

    
{% endblock %}

<!-- Scripts -->
{% block scripts %}


    <script>
        async function createExamBox(text, opts, quiz_id){
            let exam_pano_h = document.querySelector(".exam-pano > .header")

            let exam_box = document.createElement("div")
            exam_box.className = "exam-box"
            exam_box.dataset.id = quiz_id

            let text_box = document.createElement("div")
            text_box.className = "text"
            text_box.innerText = text 

            exam_box.appendChild(text_box)


            let options = document.createElement("div")
            options.className = "options"

            let i = 0;
            let opts_letters = ["a", "b", "c", "d"]
            for (const element of opts) {
                let opt_lbl = createOptionLabel(`xs-opt-${opts_letters[i]}`, opts_letters[i], element.text, quiz_id)
                options.appendChild(opt_lbl)
                i++;
            }

            exam_box.appendChild(options)

            exam_pano_h.insertAdjacentElement("afterend", exam_box); 
        }


        function createOptionLabel(id, opt, opt_text, quiz_id){
            let lbl = document.createElement("label")
            lbl.className = "option"
            lbl.setAttribute("for", id)

            let lbl_input = document.createElement("input")
            lbl_input.setAttribute("type", "radio")
            lbl_input.setAttribute("name", `${quiz_id}-answer`)
            lbl_input.setAttribute("value", opt)
            lbl_input.setAttribute("id", id)
            lbl_input.setAttribute("onclick", "checkAnswer(this)")

            let sp = document.createElement("span")
            sp.innerText = opt 

            let p = document.createElement("p")
            p.innerText = opt_text

            lbl.appendChild(lbl_input)
            lbl.appendChild(sp)
            lbl.appendChild(p)

            return lbl
        }
    
    
        async function getQuizForExamPano(id=null, btn=null){
            let sp = document.querySelector(".exam-pano > .button-group > span")
            sp.innerHTML = `<i class='fa-solid fa-spinner fa-spin'></i>`

            let url = document.querySelector(".exam-pano").dataset.url 
            const response = await fetch(url, {
                method: "POST",

                headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": getCookie("csrftoken"),
                },

                body: JSON.stringify({
                    "id": id ? id : null
                    // "user_answer": userAnswer
                })
            })

            const data = await response.json()

            if (id && data.success && btn){
                document.querySelector(".exam-box").remove()
                btn.removeAttribute("disabled")
            }

            if (data.success){
                createExamBox(data.text, data.options, data.id)
                sp.innerHTML = 5                
            }
        }

        getQuizForExamPano()

        // Next Quiz Button
        function nextQuiz(btn){
            btn.setAttribute("disabled", true)
            let id = btn.parentElement.previousElementSibling.dataset.id 
            getQuizForExamPano(id, btn)
        }
    
        // Check answer
        async function checkAnswer(input){
            let getNextQuizbtn = document.getElementById("get-next-quiz")
            let getPrevQuizbtn = document.getElementById("get-prev-quiz")
            getNextQuizbtn.disabled = true
            getPrevQuizbtn.disabled = true


            let inputs = input.parentElement.parentElement.querySelectorAll("input")
            inputs.forEach(element => {
                element.setAttribute("disabled", true)
            });


            let url = document.querySelector(".exam-pano").dataset.uri
            let id = document.querySelector(".exam-box").dataset.id 
            let answer = input.value 

            const response = await fetch(url, {
                method: "POST",

                headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": getCookie("csrftoken"),
                },

                body: JSON.stringify({
                    "id": id ? id : null,
                    "answer": answer ? answer : null
                })
            })

            const data = await response.json()
            const examPano = document.querySelector(".exam-pano");
            examPano.classList.remove("animate__animated", "animate__flash", "animate__headShake");
            void examPano.offsetWidth;
            
            if (data.success==true){
                examPano.classList.add("animate__animated", "animate__flash");
                input.nextElementSibling.style.backgroundColor = "var(--bg)"
                input.nextElementSibling.style.color = "var(--all-light)"
            } else {
                examPano.classList.add("animate__animated", "animate__headShake");
                input.nextElementSibling.style.backgroundColor = "var(--danger)"
                input.nextElementSibling.style.color = "var(--all-light)"
            }
            getNextQuizbtn.disabled = false
            getPrevQuizbtn.disabled = false
        }
    
    </script>


{% endblock %}
